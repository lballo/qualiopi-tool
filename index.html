<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Qualiopi — Laura Ballo (maquette interactive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#3E9C7A; --green-d:#2F7A5F; --green-l:#EAF5F0; --green-ink:#1F5E48;
  --ink:#111827; --ink-2:#374151; --muted:#6B7280; --muted-2:#9CA3AF;
  --line:#E5E7EB; --line-2:#F3F4F6; --bg:#F7F8FA; --white:#fff;
  --amber:#B45309; --amber-bg:#FEF3C7; --red:#B91C1C; --red-bg:#FEE2E2;
  --blue:#1D4ED8; --blue-bg:#DBEAFE; --violet:#6D28D9; --violet-bg:#EDE9FE;
  --r:10px; --r-lg:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
svg{flex-shrink:0}

.mockbar{background:var(--ink);color:#D1D5DB;font-size:12px;padding:7px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mockbar b{color:#6EE7B7;font-weight:600}
.mockbar button{margin-left:auto;border:1px solid #374151;border-radius:7px;padding:3px 10px;font-size:11.5px;color:#D1D5DB}
.mockbar button:hover{border-color:#6B7280;color:#fff}

.shell{display:flex;min-height:100vh}

/* Sidebar */
.side{width:236px;flex-shrink:0;background:var(--white);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;font-weight:700;font-size:15px}
.logo svg{width:22px;height:22px;color:var(--green)}
.navsec{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);padding:15px 8px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-2);transition:.15s}
.nav svg{width:19px;height:19px;opacity:.85}
.nav:hover{background:var(--line-2)}
.nav.on{background:var(--green);color:#fff;font-weight:600}
.nav.on svg{opacity:1}
.nav .cnt{margin-left:auto;font-size:11.5px;color:var(--muted-2)}
.nav.on .cnt{color:rgba(255,255,255,.75)}
.nav.grad{background:linear-gradient(97deg,#7C3AED 0%,#4F46E5 48%,#3E9C7A 100%);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(99,68,214,.28)}
.nav.grad:hover{filter:brightness(1.06)}
.nav.grad .sparkle{margin-left:auto;width:17px;height:17px}
.side .foot{margin-top:auto;padding-top:14px}
.premium{display:block;width:100%;background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;text-align:center}

/* Main */
.main{flex:1;min-width:0;padding:22px 26px 60px}
.view{display:none}
.view.on{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.ph{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph .icobox{width:44px;height:44px;border-radius:11px;background:var(--green-l);color:var(--green-d);display:flex;align-items:center;justify-content:center}
.ph .icobox svg{width:21px;height:21px}
.icobox svg{width:19px;height:19px}
.ph h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.ph p{color:var(--muted);font-size:13.5px}
.ph .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.btn.pri{background:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-d)}
.btn.sec{background:var(--white);border:1px solid var(--line);color:var(--ink-2)}
.btn.sec:hover{border-color:var(--muted-2)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.danger{color:var(--red);border-color:#FCA5A5}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:16px}
.card.pad0{padding:0;overflow:hidden}
.ct{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cd{color:var(--muted);font-size:13px;margin-top:2px}
.chead{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.chead .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.ind{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--white)}
.tag{font-size:11.5px;font-weight:600;border-radius:20px;padding:3px 9px;display:inline-block;white-space:nowrap}
.tag.ok{background:var(--green-l);color:var(--green-ink)}
.tag.warn{background:var(--amber-bg);color:var(--amber)}
.tag.bad{background:var(--red-bg);color:var(--red)}
.tag.neutral{background:var(--line-2);color:var(--muted)}
.tag.info{background:var(--blue-bg);color:var(--blue)}
.tag.vio{background:var(--violet-bg);color:var(--violet)}
button.tag{cursor:pointer;border:none}
button.tag:hover{filter:brightness(.96)}

.conf{background:#FFFDF6;border:1px solid #FDE68A;border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px}
.conf .t{font-size:13.5px;font-weight:700;color:#92400E;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.g .l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:var(--ink-2)}
.g .l b{font-weight:600;color:var(--muted)}
.g .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.g .bar i{display:block;height:100%;background:#F59E0B;border-radius:3px;transition:width .4s ease}
.g .bar i.full{background:var(--green)}
.g.done .l b{color:var(--green-d)}

.todo{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line-2);font-size:13.5px}
.todo:first-of-type{border-top:none}
.todo .d{width:6px;height:6px;border-radius:50%;background:#F59E0B;flex-shrink:0}
.todo .d.ok{background:var(--green)}
.todo .go{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.todo:hover .go{color:var(--green-d)}
.todo.click{cursor:pointer}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 17px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.kpi .v small{font-size:14px;color:var(--muted-2);font-weight:500}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:1px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);padding:11px 16px;background:#FAFBFC;border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFBFC}
td .s{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.right{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--green-l);color:var(--green-d);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}
.av.gold{background:#FEF3C7;color:#92400E}
.prog{height:5px;width:82px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld .h{font-size:12px;color:var(--muted);margin-top:5px}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;background:var(--white);font:inherit;font-size:13.5px;
  color:var(--ink);padding:9px 12px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(62,156,122,.13)}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
input.err,textarea.err,select.err{border-color:#F87171;background:#FEF2F2}
textarea{min-height:88px;resize:vertical;line-height:1.6}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat}
select[multiple]{background-image:none;padding:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--white);cursor:pointer}
.ck input{accent-color:var(--green);width:15px;height:15px}
.ck:has(input:checked){border-color:var(--green);background:var(--green-l)}

.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:18px}
.theme{background:var(--white);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;gap:12px;align-items:flex-start;text-align:left;transition:.15s}
.theme:hover{border-color:var(--green)}
.theme.on{border-color:var(--green);box-shadow:0 0 0 3px rgba(62,156,122,.12)}
.theme .tic{width:34px;height:34px;border-radius:9px;background:var(--line-2);color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.theme .tic svg{width:17px;height:17px}
.theme.on .tic{background:var(--green);color:#fff}
.theme .tt{font-size:13.5px;font-weight:600;line-height:1.4}
.theme .ind{margin-top:7px}
.theme .n{font-size:12px;color:var(--muted);margin-top:5px}

.canvas{border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;background:#FCFDFD}
.canvas .ch{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--green-ink)}
.canvas .ch svg{width:16px;height:16px}
.canvas .cs{font-size:12.5px;color:var(--muted);margin:3px 0 11px;line-height:1.5}
.canvas .row{display:flex;gap:9px;flex-wrap:wrap}
.canvas .row button{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:8px 13px;font-size:13px;font-weight:500}
.canvas .row button:hover{border-color:var(--green);color:var(--green-d)}
.canvas .row button.on{border-color:var(--green);background:var(--green-l);color:var(--green-ink);font-weight:600}

.up{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;background:var(--white);transition:.15s;cursor:pointer;width:100%}
.up:hover{border-color:var(--green);background:#FCFEFD}
.up.filled{border-style:solid;border-color:var(--green);background:var(--green-l)}
.up .t{font-size:13.5px;font-weight:500;color:var(--ink-2)}
.up .s{font-size:12px;color:var(--muted-2);margin-top:2px}

.tabs{display:flex;gap:4px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:18px;flex-wrap:wrap}
.tab{font-size:13px;font-weight:500;color:var(--muted);padding:7px 13px;border-radius:7px;display:flex;align-items:center;gap:6px}
.tab:hover{background:var(--line-2)}
.tab.on{background:var(--green-l);color:var(--green-ink);font-weight:600}
.tab .n{background:var(--white);border-radius:20px;padding:0 6px;font-size:11px;font-weight:600}

.slot-h,.slot{display:grid;grid-template-columns:1.4fr 1.1fr .95fr .95fr 54px 32px;gap:9px;align-items:center}
.slot-h{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2);margin-bottom:8px}
.slot{margin-bottom:9px}
.slot .du{font-size:12.5px;color:var(--muted);text-align:center}
.slot .rm{color:var(--muted-2);border-radius:7px;padding:6px;text-align:center;font-size:14px}
.slot .rm:hover{color:var(--red);background:var(--red-bg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tools button{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.tools button:hover{border-color:var(--green);color:var(--green-d)}

.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.empty{text-align:center;padding:42px 20px}
.empty .e{width:52px;height:52px;border-radius:14px;background:var(--line-2);color:var(--muted-2);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty .e svg{width:23px;height:23px}
.empty b{display:block;font-size:15px;margin-bottom:4px}
.empty p{color:var(--muted);font-size:13.5px;max-width:460px;margin:0 auto 16px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.sep-or{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted-2);font-size:12.5px}
.sep-or:before,.sep-or:after{content:"";flex:1;height:1px;background:var(--line)}
#paste{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;min-height:92px}
.pill-row{display:flex;gap:5px;flex-wrap:wrap}

/* Grille d'émargement */
.emg{display:flex;gap:5px;flex-wrap:wrap}
.emg button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--white);font-size:11px;font-weight:600;color:var(--muted)}
.emg button:hover{border-color:var(--green)}
.emg button.on{background:var(--green);border-color:var(--green);color:#fff}

.lnk{cursor:pointer;color:var(--green-ink);text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:var(--green)}
.convoc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#FFFDF6}
.convoc.done{background:var(--green-l);border-color:#BFE3D3}
.convoc .ci{width:32px;height:32px;border-radius:9px;background:var(--white);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--amber)}
.convoc.done .ci{color:var(--green-d)}
.convoc .ct-txt{flex:1;min-width:200px;font-size:13.5px}
.convoc .ct-txt .s{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.convoc .sp{margin-left:auto}
.etapes{display:flex;gap:4px}
.et{width:22px;height:22px;border-radius:6px;background:var(--line-2);color:var(--muted-2);display:flex;
align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:default}
.et.on{background:var(--green-l);color:var(--green-ink)}
.sub-t{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 10px}
.sub-t:first-of-type{margin-top:0}
.alert{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:var(--r-lg);padding:14px 18px;margin-bottom:16px}
.alert .at{font-size:13.5px;font-weight:700;color:var(--red);margin-bottom:6px}
.alert ul{margin:0;padding-left:20px}
.alert li{font-size:13px;color:#B91C1C;margin-bottom:2px}
.mini-sel{padding:5px 9px;font-size:12.5px;border-radius:7px}
.persrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line-2);padding:12px 2px}
.persrow:first-of-type{border-top:none}
.persrow .pi{flex:1;min-width:200px;font-size:13.5px}
.persrow .pi .s{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.persrow .pc-flags{display:flex;gap:8px;flex-wrap:wrap}
.ck.mini{padding:5px 9px;font-size:12px;gap:6px}
.ck.mini input{width:13px;height:13px}
button.lnk{background:none;border:none;padding:0;font:inherit}
.echrow{display:flex;gap:14px;align-items:flex-start;border-top:1px solid var(--line-2);padding:12px 2px}
.echrow:first-of-type{border-top:none}
.echrow .ed{min-width:130px;display:flex;flex-direction:column;gap:4px}
.echrow .ec{flex:1;font-size:13.5px}
.echrow .ec .s{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.docrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line-2);padding:11px 2px}
.docrow:first-of-type{border-top:none}
.docrow .di{flex:1;min-width:230px;font-size:13.5px}
.docrow .di .s{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.docrow .dv{min-width:150px}
.docrow .da{display:flex;gap:6px;margin-left:auto}
.adapt{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px;background:#FCFDFD}
.lienrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line-2);padding:10px 2px}
.lienrow:first-of-type{border-top:none}
.lienrow .li{min-width:190px;font-size:13.5px}
.lienrow .li .s{display:block;font-size:12px;color:var(--muted)}
.lienrow code{flex:1;min-width:220px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted);
background:var(--line-2);border-radius:7px;padding:6px 9px;word-break:break-all}
.lienrow .la{display:flex;gap:6px;margin-left:auto}
.lienrow .la a{text-decoration:none}

/* Panneau latéral */
.drawer{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:80;display:flex;justify-content:flex-end}
.drawer-panel{background:var(--bg);width:min(560px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 28px rgba(0,0,0,.14);animation:slide .2s ease}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px;background:var(--white);border-bottom:1px solid var(--line)}
.drawer-x{margin-left:auto;font-size:17px;color:var(--muted);border-radius:8px;padding:4px 9px}
.drawer-x:hover{background:var(--line-2);color:var(--ink)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px}
.drawer-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;background:var(--white);border-top:1px solid var(--line)}
.linkbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--white);font-size:13px}
.linkbox a{word-break:break-all}

/* Connexion */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.login-box{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.shell{display:none}
.shell.pret{display:flex}
#bar button{margin-left:auto}

/* Toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast.on{opacity:1;transform:translateX(-50%)}

@media(max-width:940px){
  .shell{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;gap:5px}
  .logo,.navsec,.side .foot{display:none}
  .nav{width:auto;white-space:nowrap}
  .main{padding:16px 14px 46px}
  .g2,.g3,.checks{grid-template-columns:1fr}
  .slot-h{display:none}
  .slot{grid-template-columns:1fr 1fr;gap:8px}
}

async function api(chemin, corps){
  const r=await fetch("/api/"+chemin,{

const fmtDShort=iso=>iso?new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"}):"—";
const mn=t=>{const[h,m]=(t||"0:0").split(":").map(Number);return h*60+m;};
const durH=c=>Math.max(0,mn(c.f)-mn(c.d))/60;

const sessHeures=s=>s.creneaux.reduce((a,c)=>a+durH(c),0);
/* Horaires lisibles, déduits des créneaux : « 09:00–12:30 · 13:30–17:00 ».

const sessHoraires=s=>{

};
const sessLabel=s=>{const ds=sessDates(s);if(!ds.length)return"Dates à définir";
  return ds.length===1?fmtDShort(ds[0]):fmtDShort(ds[0])+" → "+fmtDShort(ds[ds.length-1]);};

async function televerser(fichier,pageId,propriete,apres){
  if(fichier.size>4*1024*1024){toast("Fichier trop lourd (4 Mo maximum)");return;}
  toast(`Envoi de « ${fichier.name} »…`);
  try{
    const b64=await new Promise((ok,ko)=>{const r=new FileReader();
      r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=ko; r.readAsDataURL(fichier);});
    await api("upload",{pageId,propriete,nom:fichier.name,contenu:b64,type:fichier.type||"application/pdf"});
    if(apres){ apres(); render(); }
    toast(`« ${fichier.name} » déposé dans Notion`);
  }catch(e){ toast("⚠ Envoi refusé : "+e.message); }
}

/* ═══════════════ CONFORMITÉ (calculée) ═══════════════ */
function conformite(){
  const pts=[];
  const add=(lbl,ok,ind,view)=>pts.push({lbl,ok,ind,view});
  add("Programmes PDF déposés sur le catalogue", db.formations.every(f=>f.programme),"IND 1","formations");
  add("Supports pédagogiques disponibles", db.formations.filter(f=>f.supports>0).length>=3,"IND 6","formations");
  add("Veille légale alimentée", db.veilles.some(v=>v.theme==="legale"),"IND 23","veille");
  add("Veille métiers alimentée", db.veilles.some(v=>v.theme==="metiers"),"IND 24","veille");
  add("Veille pédagogique alimentée", db.veilles.some(v=>v.theme==="pedago"),"IND 25","veille");
  add("Veilles exploitées (actions décrites)", db.veilles.some(v=>v.exploitation?.trim()),"IND 23-25","veille");
  add("Conventions déposées", db.sessions.length>0 && db.sessions.every(s=>s.convention),"IND 9","sessions");
  add("Convocations envoyées", db.sessions.length>0 && db.sessions.every(s=>s.convocation),"IND 9","sessions");
  add("Émargements complets sur les sessions terminées",
      db.sessions.filter(s=>s.statut==="Terminée").every(s=>emSigned(s)>=emTotal(s) && s.emF.every(Boolean)),"IND 9","sessions");
  add("Rapports de session rédigés", db.sessions.filter(s=>s.statut==="Terminée").every(s=>s.rapport.fait),"IND 32","sessions");
  add("Développement des compétences tracé", db.formateurs.some(t=>(t.suivis||[]).length>0),"IND 22","formateurs");
  add("Financeurs référencés", db.financeurs.length>0,"IND 1","financeurs");
  add("Identité de l'organisme complète (SIRET, NDA)", !!(db.org.siret&&db.org.nda),"IND 1","organisme");
  add("Modalités et délais d'accès publiés", !!(db.org.modalitesAcces.trim()&&db.org.delaisAcces.trim()),"IND 1","organisme");
  add("Actions d'amélioration continue tracées", db.ameliorations.length>0,"IND 30-32","organisme");
  const ok=pts.filter(p=>p.ok).length;
  return {pts, ok, total:pts.length, pct:Math.round(ok/pts.length*100)};
}
const groupes=()=>{
  const c=conformite().pts;
  const by=(...inds)=>{const g=c.filter(p=>inds.some(i=>p.ind.includes(i)));return{ok:g.filter(p=>p.ok).length,t:g.length};};
  return [["Catalogue",by("IND 1","IND 6")],["Sessions",by("IND 9","IND 32")],["Veille",by("IND 23","IND 24","IND 25")],["Équipe",by("IND 22")]];
};

      </tbody></table><div style="padding:14px 20px" class="note"><b>${neuf}</b> à créer · <b>${connu}</b> déjà au répertoire, rattaché${connu>1?"s":""} sans doublon · <b>${rows.length}</b> inscription${rows.length>1?"s":""} et autant de liens personnels seront générés.</div>`
      :`<div class="empty"><div class="e">${I.import}</div><b>Rien à importer</b><p>Collez des lignes ci-dessus pour voir l'aperçu.</p></div>`}
  </div>
  <div class="acts"><button class="btn sec" data-go="apprenants">Annuler</button>
    <button class="btn pri" data-act="doImport" ${rows.length&&s?"":"disabled"}>Inscrire ${rows.length} apprenant${rows.length>1?"s":""}</button></div>`;

function parseRows(txt){
  return (txt||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const c=l.split(/\t|;/).map(x=>x.trim());
    const [nom="",prenom="",email="",tel="",fonction=""]=c;
    const known=!!email && db.apprenants.some(a=>a.email.toLowerCase()===email.toLowerCase());
    return {nom,prenom,email,tel,fonction,known};
  });
}
afterRender.import=()=>{

    clearTimeout(ta._t); ta._t=setTimeout(()=>{const p=ta.selectionStart;render();const n=$("#paste");if(n){n.focus();n.setSelectionRange(p,p);}},450);};

};

/* ─── Conformité d'une fiche formation ─── */
function confFormation(f){
  const pts=[
    ["Titre",!!f.nom,"IND 1"],["Durée",!!f.duree,"IND 1"],["Objectif professionnel",!!f.objectif.trim(),"IND 5"],
    ["Objectifs opérationnels",!!f.objectifsOp.trim(),"IND 5"],["Public bénéficiaire",!!f.publicCible.trim(),"IND 1"],
    ["Prérequis d'accès",!!f.prerequis.trim(),"IND 1"],["Délais d'accès",!!f.delais.trim(),"IND 1"],
    ["Tarif de référence",!!f.tarif,"IND 1"],["Accessibilité handicap",!!f.accessibilite.trim(),"IND 26"],
    ["Formateur qualifié rattaché",(f.formateurs||[]).length>0,"IND 21"],
    ["Modalités pédagogiques",!!f.moyens.modalites.trim(),"IND 6"],["Méthodes pédagogiques",!!f.moyens.methodes.trim(),"IND 6"],
    ["Ressources pédagogiques",!!f.moyens.ressources.trim(),"IND 6"],["Profil de l'intervenant",!!f.moyens.profil.trim(),"IND 6"],
    ["Contenu de formation",!!f.contenu.trim(),"IND 1, 6"],["Déroulé pédagogique déposé",f.deroulePdf,"IND 6"],
    ["Évaluations décrites",!!f.evalDesc.trim(),"IND 11"],["Modalités d'évaluation",!!f.evalModalites.trim(),"IND 11"],
    ["Programme PDF déposé",f.programme,"IND 1"],["Support participant déposé",f.supportPart,"IND 6"],
    ["Locaux décrits",!!f.technique.locaux.trim(),"IND 17"],["Équipements décrits",!!f.technique.equip.trim(),"IND 17"],
    ["Sanction de la formation",!!f.sanction.trim(),"IND 1"],
  ];
  const ok=pts.filter(p=>p[1]).length;
  return {pts,ok,total:pts.length,pct:Math.round(ok/pts.length*100)};
}

afterRender["formation-detail"]=()=>{
  $$("[data-f]").forEach(el=>{
    const k=el.dataset.f;
    const set=v=>{const f=F(route.param);
      if(k.includes(".")){const[a,b]=k.split(".");f[a][b]=v;}else f[k]=v;};
    if(el.tagName==="TEXTAREA"||el.type==="text") el.oninput=()=>set(el.value);
    else el.onchange=()=>{set(el.type==="number"?(el.value===""?null:+el.value):el.value);
      if(["statutPub","slug","categorie","modalite","typeTarif","nsf","nature"].includes(k)) render();};
  });
  const PROP_F={programme:"Programme PDF",deroulePdf:"Déroulé pédagogique (fichier)",
    supportPart:"Support participant",supportForm:"Support formateur"};
  $$("[data-file]").forEach(el=>el.onchange=()=>{
    const f=F(route.param),k=el.dataset.file,fs=[...el.files];
    if(!fs.length)return;
    if(k==="ressources"){f.ressources=[...f.ressources,...fs.map(x=>x.name)].slice(0,10);toast(fs.length+" ressource(s) ajoutée(s)");}
    else{f.files[k]=fs[0].name;toast("Document déposé : "+fs[0].name);}
    render();});
  $$("[data-act=fTagAdd]").forEach(el=>el.onchange=()=>{if(!el.value)return;
    const f=F(route.param);f.tags=[...(f.tags||[]),el.value];render();});
};

  const c=C(route.param)||db.clients[0];
  if(!c) return vClients();
  route.param=c.id;
  const k=confClient(c);
  const ss=db.sessions.filter(s=>s.clientId===c.id);
  const tabs=[["infos","Informations"],["docs","Documents",(c.docs||[]).length],
    ["histo","Historique",(ss.length+(c.echanges||[]).length)||null]];
  return head(I.clients,esc(c.nom),"Fiche client et analyse des besoins",
    `<span class="tag ${k.manque.length?"bad":"ok"}">${k.manque.length?"Non conforme":"Conforme"}</span>
     <button class="btn sec" data-go="clients">← Retour</button>`)+
  (k.manque.length?`<div class="alert"><div class="at">⚠ Preuves manquantes (${k.manque.length})</div>
    <ul>${k.manque.map(m=>`<li>${m}</li>`).join("")}</ul></div>`:"")+
  `<div class="tabs">${tabs.map(([id,l,n])=>`<button class="tab ${tabC===id?"on":""}" data-act="tabC" data-t="${id}">${l}${n?`<span class="n">${n}</span>`:""}</button>`).join("")}</div>`+
  ({infos:cInfos,docs:cDocs,histo:cHisto}[tabC])(c);

afterRender["client-detail"]=()=>{
  $$("[data-c]").forEach(el=>{
    const k=el.dataset.c;
    if(el.tagName==="TEXTAREA"||el.type==="text"||el.type==="email") el.oninput=()=>{C(route.param)[k]=el.value;};
    else el.onchange=()=>{C(route.param)[k]=el.value;render();};
  });
  $$("[data-doc]").forEach(el=>el.onchange=()=>{
    const c=C(route.param),d=c.docs.find(x=>x.id===el.dataset.doc);
    d.statut=el.value; if(el.value==="Signé"&&!d.signature) d.signature=new Date().toISOString().slice(0,10);
    render();
    pousser("annuaire",{action:"maj",entite:"document",id:d.id,
      champs:{statut:d.statut,signature:d.signature}},"Statut mis à jour").catch(()=>{});});
  const fi=document.getElementById("dcFichier");
  if(fi) fi.onchange=()=>{const f=fi.files?.[0]; if(f){draft.docFichier=f.name;
    document.getElementById("dcFichierNom").textContent="✓ "+f.name;}};
};

  return `<div class="card"><div class="chead"><div><div class="ct">Documents</div>
    <div class="cd">Documents rattachés au financeur (conventions-cadres, attestations, courriers…).</div></div>
    <div class="sp"><button class="btn pri sm" data-act="showAddFiDoc">+ Ajouter un document</button></div></div>
    ${draft?.fidoc?`<div class="card" style="background:#FCFDFD;margin-bottom:14px">
      <div class="ct" style="font-size:14px;margin-bottom:12px">Nouveau document</div>
      <div class="g2">
        <div class="fld"><label>Titre du document *</label><input type="text" id="fdTitre" placeholder="Ex : Convention-cadre 2026"></div>
        <div class="fld"><label>Date</label><input type="date" id="fdDate" value="2026-08-07"></div>
      </div>
      <div class="fld"><label>Fichier</label>
        <label class="up" style="display:block"><input type="file" id="fdFichier" hidden>
          <div class="t" id="fdNom">⬆ Glissez votre fichier ici ou cliquez pour parcourir</div>
          <div class="s">PDF, DOC, DOCX — max 30 Mo</div></label></div>
      <div class="acts" style="margin-top:0"><button class="btn sec" data-act="hideAddFiDoc">Annuler</button>
        <button class="btn pri" data-act="addFiDoc">Ajouter</button></div></div>`:""}
    ${docs.length?docs.map(dc=>`<div class="docrow">
      <div class="di"><b>${esc(dc.titre)}</b><span class="s">${dc.fichier?"📎 "+esc(dc.fichier):"Aucun fichier joint"} · ${dc.date?fmtDShort(dc.date):"sans date"}</span></div>
      <div class="da"><button class="btn sec sm danger" data-act="delFiDoc" data-d="${dc.id}">Retirer</button></div></div>`).join("")
    :`<div class="empty"><div class="e">${I.import}</div><b>Aucun document</b>
      <p>Ajoutez des documents rattachés à ce financeur.</p>
      <button class="btn pri" data-act="showAddFiDoc">+ Ajouter</button></div>`}
  </div>`;
}
afterRender["financeur-detail"]=()=>{
  $$("[data-fi]").forEach(el=>{
    const k=el.dataset.fi, f=db.financeurs.find(x=>x.id===route.param);
    if(el.tagName==="TEXTAREA"||el.type==="text"||el.type==="email") el.oninput=()=>{f[k]=el.value;};
    else el.onchange=()=>{f[k]=el.type==="number"?(el.value===""?null:+el.value):el.value;render();};
  });
  const fi=document.getElementById("fdFichier");
  if(fi) fi.onchange=()=>{const x=fi.files?.[0]; if(x){draft.fiFichier=x.name;
    document.getElementById("fdNom").textContent="✓ "+x.name;}};
};
function vConf(){
  const c=conformite();
  return head(I.conf,"Conformité Qualiopi","Où vous en êtes, point par point")+
  `<div class="conf"><div class="t">Conformité globale : ${c.pct} % — ${c.ok} / ${c.total} points couverts</div>
    <div class="gauges">${groupes().map(([lbl,g])=>`<div class="g ${g.ok===g.t?"done":""}"><div class="l"><span>${lbl}</span><b>${g.ok}/${g.t}</b></div>
      <div class="bar"><i class="${g.ok===g.t?"full":""}" style="width:${g.t?Math.max(3,g.ok/g.t*100):3}%"></i></div></div>`).join("")}</div></div>
  <div class="card"><div class="ct">Points ouverts</div><div class="cd" style="margin-bottom:10px">Ce qu'un auditeur relèverait aujourd'hui.</div>
    ${c.pts.filter(p=>!p.ok).map(p=>`<div class="todo click" data-go="${p.view}"><span class="d"></span> ${p.lbl} <span class="ind">${p.ind}</span><span class="go">Ouvrir ›</span></div>`).join("")||`<div class="todo"><span class="d ok"></span> Aucun point ouvert.</div>`}
  </div>
  <div class="card"><div class="ct">Points couverts</div>
    ${c.pts.filter(p=>p.ok).map(p=>`<div class="todo"><span class="d ok"></span> ${p.lbl} <span class="ind">${p.ind}</span></div>`).join("")||`<div class="note">Rien pour l'instant.</div>`}
  </div>`;
}
let tabO="identite";
function vOrganisme(){
  const o=db.org;
  const tabs=[["identite","Mon organisme"],["acces","Accès & paramètres"],
    ["qualite","Qualité",db.ameliorations.length||null],["docs","Documents"]];
  const req=[["Nom",!!o.nom],["SIRET",!!o.siret],["NDA",!!o.nda],["Représentant légal",!!o.repNom],
    ["Adresse complète",!!(o.adresse&&o.cp&&o.ville)],["Modalités d'accès",!!o.modalitesAcces.trim()],
    ["Délais d'accès",!!o.delaisAcces.trim()],["Méthodes d'implication",!!o.implication.trim()],
    ["Secteurs d'intervention",!!o.secteurs.trim()],["Règlement intérieur",!!o.docs.ri],["CGV",!!o.docs.cgv]];
  const manque=req.filter(r=>!r[1]);
  return head(I.organisme,"Mon organisme","Fiche d'identité et documents de votre organisme",
    `<span class="tag ${manque.length?"warn":"ok"}">${req.length-manque.length} / ${req.length} renseignés</span>`)+
  (manque.length?`<div class="alert" style="background:#FFFDF6;border-color:#FDE68A">
    <div class="at" style="color:#92400E">⚠ À compléter (${manque.length})</div>
    <ul>${manque.map(m=>`<li style="color:${'#92400E'}">${m[0]}</li>`).join("")}</ul></div>`:"")+
  `<div class="tabs">${tabs.map(([id,l,n])=>`<button class="tab ${tabO===id?"on":""}" data-act="tabO" data-t="${id}">${l}${n?`<span class="n">${n}</span>`:""}</button>`).join("")}</div>`+
  ({identite:oIdentite,acces:oAcces,qualite:oQualite,docs:oDocs}[tabO])(o);
}

  </div>
  <div class="card"><div class="chead">

afterRender.organisme=()=>{
  $$("[data-o]").forEach(el=>{
    const k=el.dataset.o;
    if(el.tagName==="TEXTAREA"||el.type==="text"||el.type==="email") el.oninput=()=>{db.org[k]=el.value;};
    else el.onchange=()=>{db.org[k]=el.type==="number"?(el.value===""?null:+el.value):el.value;render();};
  });
  const PROP_O={ri:"Règlement intérieur",cgv:"Conditions générales de vente",
    certif:"Certificat Qualiopi",logo:"Logo"};
  $$("[data-ofile]").forEach(el=>el.onchange=()=>{
    const f=el.files?.[0]; if(!f)return;
    const k=el.dataset.ofile;
    if(!db.org.id){toast("Enregistrez d'abord la fiche organisme");return;}
    if(PROP_O[k]) televerser(f,db.org.id,PROP_O[k],()=>{db.org.docs[k]=f.name;});
    else toast("Propriété inconnue");});
  $$("[data-oautre]").forEach(el=>el.onchange=()=>{
    const f=el.files?.[0]; if(!f)return;
    if(!db.org.id){toast("Enregistrez d'abord la fiche organisme");return;}
    televerser(f,db.org.id,"Documents administratifs",()=>{db.org.autres=[...(db.org.autres||[]),f.name];});});
  const selType=document.getElementById("amType");
  if(selType) selType.onchange=()=>{
    const g=id=>document.getElementById(id);
    draft.amType=selType.value;
    draft.amVals={...(draft.amVals||{}),objet:g("amObjet").value,situation:g("amSituation").value,
      action:g("amAction").value,date:g("amDate").value,impact:g("amImpact").value,
      statut:g("amStatut").value,signalePar:g("amSignale").value,source:g("amSource").value,
      responsable:g("amResp").value,parties:g("amParties").value,sessionId:g("amSession").value,
      participantId:g("amParticipant")?g("amParticipant").value:"",
      echeance:g("amEcheance").value,verification:g("amVerif").value};
    render();
  };
  const selSess=document.getElementById("abSession");
  if(selSess) selSess.onchange=()=>{
    const g=id=>document.getElementById(id);
    draft.abVals={...(draft.abVals||{}),sessionId:selSess.value,participantId:"",
      dateAbandon:g("abDate").value,stade:g("abStade").value,motif:g("abMotif").value,
      origine:g("abOrigine").value,motifDetail:g("abMotifDetail").value,
      solution:g("abSolution").value,consequence:g("abConsequence").value,
      dateSuivi:g("abDateSuivi").value,contact:g("abContact").checked,
      actionCreee:g("abAction").checked,commentaires:g("abCommentaires").value};
    render();
  };
  $$("[data-am]").forEach(el=>el.onchange=()=>{
    const a=db.ameliorations.find(x=>x.id===el.dataset.am); a.statut=el.value;
    a.cloture = a.statut==="Efficacité vérifiée" ? new Date().toISOString().slice(0,10) : "";
    render();
    pousser("qualite",{action:"maj",entite:"amelioration",id:a.id,
      champs:{statut:a.statut}},
      a.cloture?"Action clôturée aujourd'hui":"Statut mis à jour").catch(()=>{});});
};

const ACT={
  /* créneaux */
  slotAdd:()=>{const l=draft.creneaux[draft.creneaux.length-1]||{date:"2026-09-15",type:"Matin"};
    const nx=l.type==="Matin"?STD[1]:STD[0];
    draft.creneaux.push({date:l.date,type:nx[0],d:nx[1],f:nx[2]});render();},
  slotDel:b=>{draft.creneaux.splice(+b.dataset.i,1);render();},
  slotApply:()=>{draft.creneaux=draft.creneaux.map(c=>{const s=STD.find(x=>x[0]===c.type);return s?{...c,d:s[1],f:s[2]}:c;});render();toast("Horaires standards appliqués");},
  slotGen2:()=>{const j1=draft.creneaux[0]?.date||"2026-09-15";const d=new Date(j1+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+1);
    draft.creneaux=[j1,d.toISOString().slice(0,10)].flatMap(day=>STD.slice(0,2).map(([t,a,b])=>({date:day,type:t,d:a,f:b})));render();toast("2 jours générés");},

  sessionCreate:()=>{
    if(!draft.creneaux.length){toast("Ajoutez au moins un créneau");return;}
    const f=F(draft.formationId);
    const s={id:uid("s"),titre:draft.titre.trim()||`${f.nom} — ${C(draft.clientId).nom}`,formationId:draft.formationId,
      clientId:draft.clientId,formateurId:draft.formateurId,type:draft.type,code:draft.code,lieu:draft.lieu,
      financeurId:draft.financeurId||"",modalites:[...draft.modalites],statut:"Planifiée",convention:false,convocation:false,
      rapport:{fait:false,deroule:"",forts:"",diff:"",axes:""},besoin:{contexte:"",objectifs:"",contraintes:""},
      creneaux:draft.creneaux.map(c=>({...c})),inscrits:[],emF:draft.creneaux.map(()=>false)};
    (async()=>{
      try{
        const r=await api("sessions",{action:"creer",session:{
          titre:s.titre,code:s.code,type:s.type,modalite:draft.modalites[0]||"Présentiel",
          lieu:s.lieu,adresse:"",formationId:s.formationId,clientId:s.clientId,
          formateurId:s.formateurId,financeurId:s.financeurId,creneaux:s.creneaux}});
        s.id=r.id; db.sessions.unshift(s); toast("Session créée dans Notion");
        go("session-detail",s.id);
      }catch(e){ toast("⚠ Non créée : "+e.message); }
    })();},

  tab:b=>{tabSession=b.dataset.t;render();},
  cAdd:()=>{const s=SE(route.param);
    const l=s.creneaux[s.creneaux.length-1]||{date:new Date().toISOString().slice(0,10),type:"Matin"};
    const nx=l.type==="Matin"?STD[1]:STD[0];
    s.creneaux.push({date:l.date,type:nx[0],d:nx[1],f:nx[2]});
    s.inscrits.forEach(i=>i.em.push(false)); s.emF.push(false); render();},
  cDel:b=>{const s=SE(route.param),ix=+b.dataset.i;
    s.creneaux.splice(ix,1);
    s.inscrits.forEach(i=>i.em.splice(ix,1)); s.emF.splice(ix,1); render();},
  cApply:()=>{const s=SE(route.param);
    s.creneaux=s.creneaux.map(c=>{const x=STD.find(y=>y[0]===c.type);return x?{...c,d:x[1],f:x[2]}:c;});
    render();toast("Horaires standards appliqués — pensez à enregistrer");},
  cGen2:()=>{const s=SE(route.param);
    const j1=s.creneaux[0]?.date||new Date().toISOString().slice(0,10);
    const d2=new Date(j1+"T12:00:00Z"); d2.setUTCDate(d2.getUTCDate()+1);
    s.creneaux=[j1,d2.toISOString().slice(0,10)].flatMap(j=>STD.slice(0,2).map(([t,a,b])=>({date:j,type:t,d:a,f:b})));
    s.inscrits.forEach(i=>i.em=s.creneaux.map(()=>false)); s.emF=s.creneaux.map(()=>false);
    render();toast("2 jours générés — pensez à enregistrer");},
  cSave:()=>{const s=SE(route.param);
    if(!s.creneaux.length){toast("Ajoutez au moins un créneau");return;}
    pousser("sessions",{action:"creneaux",id:s.id,creneaux:s.creneaux},"Planning enregistré")
      .then(r=>{ if(r){ s.dateDebut=r.debut; s.dateFin=r.fin; } render(); }).catch(()=>{});},
  sign:()=>toast("Les émargements se signent depuis le lien stagiaire ou le lien formateur"),
  signF:()=>toast("L'émargement formateur se signe depuis son lien dédié"),
  togPos:b=>{const s=SE(route.param);s.inscrits[+b.dataset.i].pos=!s.inscrits[+b.dataset.i].pos;render();},
  togSat:b=>{const s=SE(route.param);s.inscrits[+b.dataset.i].sat=!s.inscrits[+b.dataset.i].sat;render();},
  desinscrire:b=>{const s=SE(route.param),ix=+b.dataset.i,ins=s.inscrits[ix];
    (async()=>{ try{
      if(ins.id) await api("inscriptions",{action:"desinscrire",id:ins.id});
      s.inscrits.splice(ix,1);render();toast("Apprenant retiré de la session");
    }catch(e){ toast("⚠ "+e.message); } })();},
  inscrire:()=>{const s=SE(route.param);const sel=[...$("#pick").selectedOptions].map(o=>o.value);
    if(!sel.length){toast("Sélectionnez au moins une personne");return;}
    sel.forEach(id=>s.inscrits.push({aId:id,pos:false,ev:null,sat:false,em:s.creneaux.map(()=>false),convoc:false,convocDate:null,adaptation:false,besoin:"",mesures:"",mode:"Entreprise (intra)",financement:"Employeur / fonds propres",financeurId:"",montant:null,attestation:false,froid:false}));
    render();toast(sel.length+" apprenant(s) inscrit(s)");},
  depConvention:()=>{const s=SE(route.param);

  depConvocation:()=>{const s=SE(route.param);s.convocation=!s.convocation;render();

      s.convocation?"Convocations marquées envoyées":"Convocations à envoyer").catch(()=>{});},
  depProgramme:()=>{const s=SE(route.param),f=F(s.formationId);
    if(!f){toast("Aucune formation rattachée");return;}
    if(f.programme){toast("Programme déjà déposé");return;}
    choisirFichier(x=>televerser(x,f.id,"Programme PDF",()=>{f.programme=true;}));},
  saveRapport:()=>{const s=SE(route.param);
    ["deroule","forts","diff","axes"].forEach(k=>{const el=document.querySelector(`[data-r="${k}"]`);if(el)s.rapport[k]=el.value;});
    s.rapport.fait=!!(s.rapport.deroule.trim()||s.rapport.axes.trim());
    if(!s.rapport.fait){toast("Rapport vide — renseignez au moins le déroulé");render();return;}
    pousser("sessions",{action:"maj",id:s.id,champs:{
      rapportDeroule:s.rapport.deroule,rapportForts:s.rapport.forts,
      rapportDiff:s.rapport.diff,rapportAxes:s.rapport.axes,rapportFait:true}},
      "Rapport enregistré").then(()=>render()).catch(()=>{});},

  /* apprenants */
  showAddAppr:()=>{draft={addAppr:true};render();},
  hideAddAppr:()=>{draft=null;render();},
  addAppr:()=>{const nom=$("#nAppNom").value.trim();
    if(!nom){toast("Le nom est obligatoire");$("#nAppNom").classList.add("err");return;}
    const entNom=$("#nAppEnt").value, ent=db.clients.find(c=>c.nom===entNom);

    (async()=>{
      try{
        const r=await api("apprenants",{action:"creer",apprenant:a});

        draft=null;render();
        toast(r.existait?"Apprenant déjà présent — rattaché":"Apprenant ajouté au répertoire");
      }catch(e){ toast("⚠ Non enregistré : "+e.message); }

  delAppr:b=>{const id=b.dataset.a;

    (async()=>{ try{
      await api("apprenants",{action:"supprimer",id});

  attach:()=>{const s=SE($("#attSess").value);const sel=[...$("#attAppr").selectedOptions].map(o=>o.value);

    render();toast(n?`${n} inscription(s) créée(s)`:"Déjà inscrits");},

  saveAppr:()=>{const a=A(route.param);

    pousser("apprenants",{action:"maj",id:a.id,champs:{

      linkedin:g("pLi").value.trim(),principal:g("pPrincipal").checked,repLegal:g("pRep").checked};

      const r=await api("annuaire",{action:"creer",entite:"contact",champs:{...p,entrepriseId:c.id}});

      dateAbandon:g("abDate").value,stade:g("abStade").value,motif:g("abMotif").value,
      motifDetail:g("abMotifDetail").value.trim(),origine:g("abOrigine").value,

      commentaires:g("abCommentaires").value.trim(),actionCreee:g("abAction").checked};
    const modif=draft.abId;
    (async()=>{ try{
      const r=await api("qualite",{action:modif?"maj":"creer",entite:"abandon",

      if(modif){ const i=db.abandons.findIndex(x=>x.id===modif);
